---
- name: Deployer FastAPI et MLflow
  community.docker.docker_compose_v2:
    project_src: "{{ project_dir }}"
    files:
      - compose.yaml
    state: present
    pull: never
    build: never
    recreate: auto
    remove_orphans: false
  register: deploy_result

- name: Afficher le resultat
  debug:
    msg: "Deployment changed={{ deploy_result.changed }}"
